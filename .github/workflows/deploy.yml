name: Deploy Enterprise Dashboard to GitHub Pages

on:
  push:
    branches: ["main"] # main branch ပေါ် ကုဒ် push လုပ်တိုင်း automatic အလုပ်လုပ်မည်

# GitHub Pages သို့ တင်ရန်အတွက် ခွင့်ပြုချက် (Permissions) တောင်းခံခြင်း
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # GitHub Pages အတွက် သတ်မှတ်ချက်များ ချိန်ညှိခြင်း
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Stock.html ကို ပင်မစာမျက်နှာ index.html အဖြစ် ပြောင်းလဲပေးခြင်း (GitHub Pages သတ်မှတ်ချက်အရ)
      - name: Prepare Entry Point
        run: cp Stock.html index.html

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # လက်ရှိ folder ထဲက ဖိုင်အားလုံးကို တင်မည်

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4