name: Deploy Enterprise Dashboard to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ရည်ရွယ်ချက်: Stock.html သို့မဟုတ် stock.html ရှိပါက index.html အဖြစ် ပြောင်းလဲရန်
      - name: Dynamic Entry Point Setup
        run: |
          if [ -f "Stock.html" ]; then
            cp Stock.html index.html
          elif [ -f "stock.html" ]; then
            cp stock.html index.html
          else
            echo "Error: Dashboard HTML file not found!" && exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4